name: Build and Push Staging

on:
  push:
    branches: ["staging"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tombergson/tom-bergson-portfolio-next.js
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare tags
        id: vars
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "DATE_TAG=$(date +'%Y-%m-%d_%H-%M')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitLab Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: tombergson
          password: ${{ secrets.GITLAB_TOKEN }}

      # Jeden build: przetestowany obraz jest dokładnie tym, który trafia do rejestrów.
      # pull: true wymusza świeży obraz bazowy node:24-alpine (bez starego cache z runnera).
      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          pull: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.SHORT_SHA }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.DATE_TAG }}
            registry.gitlab.com/${{ env.IMAGE_NAME }}:staging

      - name: Verify Next.js (Smoke Test)
        run: |
          IMG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging"
          docker run -d --name test-container -p 3000:3000 "$IMG"

          NODE_VERSION=$(docker exec test-container node -v)
          echo "Node w obrazie: $NODE_VERSION"
          case "$NODE_VERSION" in
            v24.*) ;;
            *)
              echo "❌ Oczekiwano Node 24, jest: $NODE_VERSION"
              docker logs test-container
              exit 1
              ;;
          esac

          STATUS="000"
          for i in $(seq 1 30); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:3000 || true)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
              break
            fi
            sleep 2
          done
          echo "Next.js responded with status: $STATUS"

          if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
            echo "❌ Smoke Test Failed: HTTP $STATUS"
            docker logs test-container
            exit 1
          fi
          echo "✅ Smoke Test Passed!"

      - name: Cleanup test container
        if: always()
        run: docker rm -f test-container || true

      - name: Push final image to GHCR
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.SHORT_SHA }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.DATE_TAG }}

      - name: Push image copy to GitLab Registry
        run: docker push registry.gitlab.com/${{ env.IMAGE_NAME }}:staging

      # staging = źródło prawdy: dev i main na GitLabie są wyrównywane do tego samego commita
      - name: Push code mirror to GitLab (staging, dev, main aligned to staging)
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -euo pipefail
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${{ env.IMAGE_NAME }}.git"

          for BRANCH in staging dev main; do
            echo "→ gitlab/${BRANCH} := $(git rev-parse --short HEAD)"
            git push gitlab "HEAD:refs/heads/${BRANCH}" --force
          done