name: Mirror to GitLab

on:
  push:
    branches: ["main", "dev"]

env:
  GITLAB_REPO: tombergson/tom-bergson-portfolio-next.js

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push branch to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${{ env.GITLAB_REPO }}.git"
          git push gitlab "HEAD:refs/heads/${{ github.ref_name }}" --force